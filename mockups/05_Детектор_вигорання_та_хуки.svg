<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap");
      text { font-family: "Inter", sans-serif; }
    </style>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- App Background -->
  <rect width="1440" height="900" fill="#090D16"/>

  <!-- Left Sidebar -->
  <g id="Sidebar">
    <rect x="0" y="0" width="250" height="900" fill="#0E1422"/>
    <line x1="250" y1="0" x2="250" y2="900" stroke="#1A2336" stroke-width="1"/>

    <!-- Brand Header -->
    <g id="BrandHeader" transform="translate(20, 24)">
      <rect x="0" y="0" width="38" height="38" rx="10" fill="url(#brandGrad)"/>
      <text font-family="Inter, sans-serif" x="19" y="24" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">MkV</text>
      <text font-family="Inter, sans-serif" x="48" y="17" fill="#FFFFFF" font-size="13.5" font-weight="700">MkV Sales Manager</text>
      <text font-family="Inter, sans-serif" x="48" y="32" fill="#94A3B8" font-size="10.5" font-weight="500">CRM • Media Buying OS</text>
    </g>

    <!-- Navigation Section -->
    <text font-family="Inter, sans-serif" x="20" y="108" fill="#64748B" font-size="10" font-weight="700" letter-spacing="1">ОСНОВНЕ МЕНЮ</text>
    
    <g id="Nav_0">
      <rect x="12" y="125" width="226" height="40" rx="8" fill="transparent"/>
      <circle cx="30" cy="145" r="3" fill="#475569"/>
      <text font-family="Inter, sans-serif" x="46" y="150" fill="#94A3B8" font-size="13" font-weight="500">Огляд платформи</text>
    </g>

    <g id="Nav_1">
      <rect x="12" y="173" width="226" height="40" rx="8" fill="transparent"/>
      <circle cx="30" cy="193" r="3" fill="#475569"/>
      <text font-family="Inter, sans-serif" x="46" y="198" fill="#94A3B8" font-size="13" font-weight="500">Дашборд аналітики</text>
    </g>

    <g id="Nav_2">
      <rect x="12" y="221" width="226" height="40" rx="8" fill="transparent"/>
      <circle cx="30" cy="241" r="3" fill="#475569"/>
      <text font-family="Inter, sans-serif" x="46" y="246" fill="#94A3B8" font-size="13" font-weight="500">ШІ-Студія сценаріїв</text>
    </g>

    <g id="Nav_3">
      <rect x="12" y="269" width="226" height="40" rx="8" fill="transparent"/>
      <circle cx="30" cy="289" r="3" fill="#475569"/>
      <text font-family="Inter, sans-serif" x="46" y="294" fill="#94A3B8" font-size="13" font-weight="500">Кампанії та медіабаїнг</text>
    </g>

    <g id="Nav_4_Active">
      <rect x="12" y="317" width="226" height="40" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.2"/>
      <circle cx="30" cy="337" r="4" fill="#6366F1"/>
      <text font-family="Inter, sans-serif" x="46" y="342" fill="#FFFFFF" font-size="13" font-weight="600">Вигорання та хуки</text>
    </g>
    <g id="Nav_Auth">
      <rect x="12" y="395" width="226" height="40" rx="8" fill="transparent" stroke="transparent" stroke-width="1.2"/>
      <circle cx="30" cy="415" r="3" fill="#475569"/>
      <text font-family="Inter, sans-serif" x="46" y="420" fill="#94A3B8" font-size="13" font-weight="500">Авторизація / Вхід</text>
    </g>

    <text font-family="Inter, sans-serif" x="20" y="385" fill="#64748B" font-size="10" font-weight="700" letter-spacing="1">БЕЗПЕКА</text>

    <!-- Student Profile Card at Bottom -->
    <g id="StudentProfile" transform="translate(14, 820)">
      <rect x="0" y="0" width="222" height="56" rx="10" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
      <circle cx="28" cy="28" r="15" fill="#4F46E5"/>
      <text font-family="Inter, sans-serif" x="28" y="33" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">МБ</text>
      <text font-family="Inter, sans-serif" x="52" y="23" fill="#FFFFFF" font-size="12" font-weight="600">Михайло Багин</text>
      <text font-family="Inter, sans-serif" x="52" y="38" fill="#64748B" font-size="10.5">Студент ІПЗ-1 • УжНУ</text>
      <circle cx="206" cy="28" r="3.5" fill="#10B981"/>
    </g>
  </g>

  <!-- Top Navigation Bar -->
  <g id="TopBar">
    <rect x="250" y="0" width="1190" height="64" fill="#0E1422"/>
    <line x1="250" y1="64" x2="1440" y2="64" stroke="#1A2336" stroke-width="1"/>

    <!-- Page Title & Breadcrumb -->
    <g transform="translate(280, 23)">
      <text font-family="Inter, sans-serif" x="0" y="16" fill="#FFFFFF" font-size="16" font-weight="700">Детектор вигорання аудиторії та хуки (Ad Fatigue)</text>
      <text font-family="Inter, sans-serif" x="0" y="32" fill="#64748B" font-size="11">MkV CRM / Детектор вигорання аудиторії та хуки (Ad Fatigue)</text>
    </g>

    <!-- Search Box -->
    <g transform="translate(810, 16)">
      <rect x="0" y="0" width="180" height="34" rx="8" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
      <text font-family="Inter, sans-serif" x="14" y="21" fill="#64748B" font-size="11.5">🔍 Пошук...</text>
    </g>

    <!-- Active Platforms Badges -->
    <g transform="translate(1005, 16)">
      <!-- Meta badge -->
      <rect x="0" y="0" width="105" height="34" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
      <circle cx="16" cy="17" r="3.5" fill="#10B981"/>
      <text font-family="Inter, sans-serif" x="26" y="21" fill="#E2E8F0" font-size="11" font-weight="600">Meta Ads</text>

      <!-- TikTok badge -->
      <rect x="115" y="0" width="105" height="34" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
      <circle cx="131" cy="17" r="3.5" fill="#10B981"/>
      <text font-family="Inter, sans-serif" x="141" y="21" fill="#E2E8F0" font-size="11" font-weight="600">TikTok Ads</text>

      <!-- Date Filter -->
      <rect x="230" y="0" width="165" height="34" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
      <text font-family="Inter, sans-serif" x="245" y="21" fill="#CBD5E1" font-size="11" font-weight="500">📅 Останні 30 днів</text>
    </g>
  </g>

  <!-- Main Content -->
  <g id="MainContent" transform="translate(280, 84)">
    
    <!-- Top Gauge / Health Metric Card -->
    <g id="FatigueHeader">
      <rect x="0" y="0" width="1120" height="120" rx="14" fill="#131B2E" stroke="#1E293B" stroke-width="1.2"/>
      
      <!-- Left Metric Gauge -->
      <g transform="translate(24, 20)">
        <text font-family="Inter, sans-serif" x="0" y="18" fill="#94A3B8" font-size="12" font-weight="500">Загальний індекс втоми аудиторії (Fatigue Score)</text>
        <text font-family="Inter, sans-serif" x="0" y="52" fill="#10B981" font-size="28" font-weight="800">24% — Норма</text>
        <!-- Meter bar -->
        <rect x="0" y="66" width="340" height="8" rx="4" fill="#1E293B"/>
        <rect x="0" y="66" width="82" height="8" rx="4" fill="#10B981"/>
      </g>

      <!-- Middle Explanation -->
      <g transform="translate(420, 26)">
        <text font-family="Inter, sans-serif" x="0" y="18" fill="#FFFFFF" font-size="13" font-weight="600">Стан аудиторії: Стабільний</text>
        <text font-family="Inter, sans-serif" x="0" y="38" fill="#94A3B8" font-size="12">Частота показів (Frequency) 1.8x знаходиться в безпечній зоні.</text>
        <text font-family="Inter, sans-serif" x="0" y="56" fill="#64748B" font-size="11.5">Лише 1 оголошення потребує заміни початкових 3 секунд.</text>
      </g>

      <!-- Right Stat Pills -->
      <g transform="translate(860, 26)">
        <rect x="0" y="0" width="235" height="68" rx="8" fill="#0A0E18" stroke="#1A2336" stroke-width="1"/>
        <text font-family="Inter, sans-serif" x="18" y="28" fill="#64748B" font-size="11">Активних креативів: <tspan fill="#FFFFFF" font-weight="700">12</tspan></text>
        <text font-family="Inter, sans-serif" x="18" y="48" fill="#64748B" font-size="11">Потребують оновлення: <tspan fill="#F87171" font-weight="700">1 креатив</tspan></text>
      </g>
    </g>

    <!-- Hook Retention Table (3s Hold Rate) -->
    <g id="HoldRateSection" transform="translate(0, 140)">
      <rect x="0" y="0" width="1120" height="260" rx="14" fill="#131B2E" stroke="#1E293B" stroke-width="1.2"/>
      
      <text font-family="Inter, sans-serif" x="24" y="32" fill="#FFFFFF" font-size="15" font-weight="700">Аналіз утримання уваги на перших секундах (3s Hold Rate)</text>
      <text font-family="Inter, sans-serif" x="24" y="50" fill="#64748B" font-size="12">Показник того, скільки людей дивляться відео після перших 3 секунд (хука)</text>

      <!-- Table Header -->
      <g transform="translate(24, 65)">
        <rect x="0" y="0" width="1072" height="34" rx="6" fill="#0A0E18"/>
        <text font-family="Inter, sans-serif" x="16" y="22" fill="#64748B" font-size="11" font-weight="700">КРЕАТИВ ТА ХУК</text>
        <text font-family="Inter, sans-serif" x="300" y="22" fill="#64748B" font-size="11" font-weight="700">ПЛАТФОРМА</text>
        <text font-family="Inter, sans-serif" x="460" y="22" fill="#64748B" font-size="11" font-weight="700">3s HOLD RATE</text>
        <text font-family="Inter, sans-serif" x="640" y="22" fill="#64748B" font-size="11" font-weight="700">ЧАСТОТА (FREQ)</text>
        <text font-family="Inter, sans-serif" x="800" y="22" fill="#64748B" font-size="11" font-weight="700">СТАН КРЕАТИВУ</text>
        <text font-family="Inter, sans-serif" x="970" y="22" fill="#64748B" font-size="11" font-weight="700">ДІЯ</text>
      </g>

      <!-- Row 1 -->
      <g transform="translate(24, 110)">
        <text font-family="Inter, sans-serif" x="16" y="24" fill="#FFFFFF" font-size="12.5" font-weight="600">EcoCream_Hook_Curiosity</text>
        <text font-family="Inter, sans-serif" x="300" y="24" fill="#CBD5E1" font-size="12">Meta Reels</text>
        <text font-family="Inter, sans-serif" x="460" y="24" fill="#10B981" font-size="13" font-weight="700">48.2% (Відмінно)</text>
        <text font-family="Inter, sans-serif" x="640" y="24" fill="#CBD5E1" font-size="12">1.6x</text>
        <rect x="800" y="10" width="90" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
        <text font-family="Inter, sans-serif" x="845" y="24" fill="#34D399" font-size="10.5" font-weight="700" text-anchor="middle">Ефективний ✓</text>
        <text font-family="Inter, sans-serif" x="970" y="24" fill="#64748B" font-size="11.5">Масштабувати</text>
        <line x1="0" y1="42" x2="1072" y2="42" stroke="#1A2336" stroke-width="1"/>
      </g>

      <!-- Row 2 -->
      <g transform="translate(24, 160)">
        <text font-family="Inter, sans-serif" x="16" y="24" fill="#FFFFFF" font-size="12.5" font-weight="600">TikTok_Spark_Review</text>
        <text font-family="Inter, sans-serif" x="300" y="24" fill="#CBD5E1" font-size="12">TikTok Ads</text>
        <text font-family="Inter, sans-serif" x="460" y="24" fill="#38BDF8" font-size="13" font-weight="700">39.5% (Добре)</text>
        <text font-family="Inter, sans-serif" x="640" y="24" fill="#CBD5E1" font-size="12">2.1x</text>
        <rect x="800" y="10" width="90" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
        <text font-family="Inter, sans-serif" x="845" y="24" fill="#38BDF8" font-size="10.5" font-weight="700" text-anchor="middle">Стабільний</text>
        <text font-family="Inter, sans-serif" x="970" y="24" fill="#64748B" font-size="11.5">Спостереження</text>
        <line x1="0" y1="42" x2="1072" y2="42" stroke="#1A2336" stroke-width="1"/>
      </g>

      <!-- Row 3: Burnout -->
      <g transform="translate(24, 210)">
        <text font-family="Inter, sans-serif" x="16" y="24" fill="#FFFFFF" font-size="12.5" font-weight="600">SummerSale_OldHook</text>
        <text font-family="Inter, sans-serif" x="300" y="24" fill="#CBD5E1" font-size="12">TikTok / Reels</text>
        <text font-family="Inter, sans-serif" x="460" y="24" fill="#F87171" font-size="13" font-weight="700">14.8% (Падіння!)</text>
        <text font-family="Inter, sans-serif" x="640" y="24" fill="#F87171" font-size="12">3.4x</text>
        <rect x="800" y="10" width="105" height="20" rx="4" fill="rgba(239, 68, 68, 0.15)"/>
        <text font-family="Inter, sans-serif" x="852" y="24" fill="#F87171" font-size="10.5" font-weight="700" text-anchor="middle">Вигорання креативу</text>
        <rect x="965" y="10" width="90" height="20" rx="4" fill="#4F46E5"/>
        <text font-family="Inter, sans-serif" x="1010" y="24" fill="#FFFFFF" font-size="10.5" font-weight="600" text-anchor="middle">Замінити хук ⚡</text>
      </g>
    </g>

    <!-- Quick Hook Rotation Tool (Direct in-app solution) -->
    <g id="HookRotationTool" transform="translate(0, 420)">
      <rect x="0" y="0" width="1120" height="340" rx="14" fill="#131B2E" stroke="#1E293B" stroke-width="1.2"/>
      
      <text font-family="Inter, sans-serif" x="24" y="32" fill="#FFFFFF" font-size="15" font-weight="700">Швидка ротація хука для «SummerSale_OldHook»</text>
      <text font-family="Inter, sans-serif" x="24" y="50" fill="#94A3B8" font-size="12">Не потрібно перезапускати кампанію та втрачати історію навчання пікселя — просто замініть перші 3 секунди ролика:</text>

      <!-- 3 AI Hook Variants (Cards) -->
      <g transform="translate(24, 75)">
        <!-- Variant 1 -->
        <g id="Hook_Variant_1" transform="translate(0, 0)">
          <rect x="0" y="0" width="340" height="175" rx="10" fill="#0A0E18" stroke="#6366F1" stroke-width="1.5"/>
          <rect x="16" y="16" width="90" height="20" rx="4" fill="rgba(99, 102, 241, 0.2)"/>
          <text font-family="Inter, sans-serif" x="61" y="30" fill="#818CF8" font-size="10.5" font-weight="700" text-anchor="middle">ВАРІАНТ 1 (ШІ)</text>
          
          <text font-family="Inter, sans-serif" x="16" y="60" fill="#FFFFFF" font-size="12.5" font-weight="600">«Ця помилка в догляді коштує тобі чистої шкіри...»</text>
          <text font-family="Inter, sans-serif" x="16" y="85" fill="#94A3B8" font-size="11.5">Психологічний тригер: страх втрати + інтрига.</text>

          <rect x="16" y="110" width="115" height="22" rx="4" fill="#1E293B"/>
          <text font-family="Inter, sans-serif" x="73" y="125" fill="#34D399" font-size="10.5" font-weight="600" text-anchor="middle">Прогноз Hold: +24%</text>

          <rect x="16" y="138" width="308" height="26" rx="6" fill="#4F46E5"/>
          <text font-family="Inter, sans-serif" x="170" y="155" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">✓ Обрати цей хук</text>
        </g>

        <!-- Variant 2 -->
        <g id="Hook_Variant_2" transform="translate(365, 0)">
          <rect x="0" y="0" width="340" height="175" rx="10" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
          <rect x="16" y="16" width="90" height="20" rx="4" fill="#1E293B"/>
          <text font-family="Inter, sans-serif" x="61" y="30" fill="#94A3B8" font-size="10.5" font-weight="600" text-anchor="middle">ВАРІАНТ 2 (ШІ)</text>
          
          <text font-family="Inter, sans-serif" x="16" y="60" fill="#FFFFFF" font-size="12.5" font-weight="600">«3 причини, чому твій крем не працює влітку...»</text>
          <text font-family="Inter, sans-serif" x="16" y="85" fill="#94A3B8" font-size="11.5">Психологічний тригер: список + сезонність.</text>

          <rect x="16" y="110" width="115" height="22" rx="4" fill="#1E293B"/>
          <text font-family="Inter, sans-serif" x="73" y="125" fill="#38BDF8" font-size="10.5" font-weight="600" text-anchor="middle">Прогноз Hold: +19%</text>

          <rect x="16" y="138" width="308" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
          <text font-family="Inter, sans-serif" x="170" y="155" fill="#CBD5E1" font-size="11" font-weight="600" text-anchor="middle">Обрати варіант</text>
        </g>

        <!-- Variant 3 -->
        <g id="Hook_Variant_3" transform="translate(730, 0)">
          <rect x="0" y="0" width="340" height="175" rx="10" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
          <rect x="16" y="16" width="90" height="20" rx="4" fill="#1E293B"/>
          <text font-family="Inter, sans-serif" x="61" y="30" fill="#94A3B8" font-size="10.5" font-weight="600" text-anchor="middle">ВАРІАНТ 3 (ШІ)</text>
          
          <text font-family="Inter, sans-serif" x="16" y="60" fill="#FFFFFF" font-size="12.5" font-weight="600">«Показую засіб, який замінив мені 5 баночок...»</text>
          <text font-family="Inter, sans-serif" x="16" y="85" fill="#94A3B8" font-size="11.5">Психологічний тригер: особистий досвід (UGC).</text>

          <rect x="16" y="110" width="115" height="22" rx="4" fill="#1E293B"/>
          <text font-family="Inter, sans-serif" x="73" y="125" fill="#34D399" font-size="10.5" font-weight="600" text-anchor="middle">Прогноз Hold: +28%</text>

          <rect x="16" y="138" width="308" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
          <text font-family="Inter, sans-serif" x="170" y="155" fill="#CBD5E1" font-size="11" font-weight="600" text-anchor="middle">Обрати варіант</text>
        </g>
      </g>

      <!-- Apply Button -->
      <g transform="translate(24, 275)">
        <rect x="0" y="0" width="1072" height="42" rx="8" fill="url(#btnGrad)"/>
        <text font-family="Inter, sans-serif" x="536" y="26" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">⚡ Оновити хук у Facebook &amp; TikTok без перезапуску кампанії</text>
      </g>
    </g>
  </g>
</svg>