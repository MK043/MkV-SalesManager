<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap");
      text { font-family: "Inter", sans-serif; }
    </style>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Dark Background (Dimmed app behind) -->
  <rect width="1440" height="900" fill="#070A12"/>

  <!-- Dimmed UI mockup silhouette behind modal -->
  <g opacity="0.12">
    <rect x="0" y="0" width="250" height="900" fill="#1E293B"/>
    <rect x="250" y="0" width="1190" height="64" fill="#1E293B"/>
    <rect x="280" y="90" width="265" height="105" rx="12" fill="#1E293B"/>
    <rect x="565" y="90" width="265" height="105" rx="12" fill="#1E293B"/>
    <rect x="850" y="90" width="265" height="105" rx="12" fill="#1E293B"/>
    <rect x="280" y="220" width="1120" height="300" rx="14" fill="#1E293B"/>
    <rect x="280" y="540" width="1120" height="300" rx="14" fill="#1E293B"/>
  </g>

  <!-- Modal Dialog Container (Centered) -->
  <g id="AuthModal" transform="translate(450, 110)">
    <!-- Modal Card Box -->
    <rect x="0" y="0" width="540" height="680" rx="18" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>

    <!-- Header Logo -->
    <g transform="translate(40, 40)">
      <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#brandGrad)"/>
      <text font-family="Inter, sans-serif" x="22" y="28" fill="#FFFFFF" font-size="16" font-weight="800" text-anchor="middle">MkV</text>
      
      <!-- Close button -->
      <text font-family="Inter, sans-serif" x="460" y="26" fill="#64748B" font-size="20" cursor="pointer">✕</text>

      <text font-family="Inter, sans-serif" x="0" y="76" fill="#FFFFFF" font-size="22" font-weight="700">Вхід до робочого кабінету</text>
      <text font-family="Inter, sans-serif" x="0" y="98" fill="#94A3B8" font-size="13">Платформа управління рекламою Meta Ads та TikTok Ads</text>
    </g>

    <!-- Social SSO Buttons (Meta & Google) -->
    <g transform="translate(40, 160)">
      <!-- Meta Business Button -->
      <g cursor="pointer">
        <rect x="0" y="0" width="460" height="48" rx="8" fill="#1877F2"/>
        <circle cx="28" cy="24" r="11" fill="#FFFFFF"/>
        <text font-family="Inter, sans-serif" x="28" y="29" fill="#1877F2" font-size="14" font-weight="800" text-anchor="middle">f</text>
        <text font-family="Inter, sans-serif" x="50" y="30" fill="#FFFFFF" font-size="13" font-weight="600">Продовжити через Meta Business</text>
      </g>

      <!-- Google Button -->
      <g transform="translate(0, 58)" cursor="pointer">
        <rect x="0" y="0" width="460" height="48" rx="8" fill="#1F2937" stroke="#334155" stroke-width="1"/>
        <text font-family="Inter, sans-serif" x="28" y="30" fill="#EA4335" font-size="16" font-weight="800" text-anchor="middle">G</text>
        <text font-family="Inter, sans-serif" x="50" y="30" fill="#FFFFFF" font-size="13" font-weight="600">Увійти за допомогою Google Workspace</text>
      </g>
    </g>

    <!-- Divider -->
    <g transform="translate(40, 290)">
      <line x1="0" y1="0" x2="160" y2="0" stroke="#1F2937" stroke-width="1"/>
      <text font-family="Inter, sans-serif" x="230" y="4" fill="#64748B" font-size="11" text-anchor="middle">АБО ЧЕРЕЗ КОРПОРАТИВНУ ПОШТУ</text>
      <line x1="300" y1="0" x2="460" y2="0" stroke="#1F2937" stroke-width="1"/>
    </g>

    <!-- Form Inputs -->
    <g transform="translate(40, 320)">
      <!-- Email Field -->
      <text font-family="Inter, sans-serif" x="0" y="14" fill="#94A3B8" font-size="11.5" font-weight="600">РОБОЧА ЕЛЕКТРОННА ПОШТА</text>
      <rect x="0" y="24" width="460" height="46" rx="8" fill="#0A0E18" stroke="#1F2937" stroke-width="1.2"/>
      <text font-family="Inter, sans-serif" x="16" y="52" fill="#FFFFFF" font-size="13">mykhailo.bahyn@student.uzhnu.edu.ua</text>
      <circle cx="436" cy="47" r="7" fill="#10B981"/>
      <text font-family="Inter, sans-serif" x="436" y="51" fill="#FFFFFF" font-size="9" font-weight="800" text-anchor="middle">✓</text>

      <!-- Password / Token Field -->
      <text font-family="Inter, sans-serif" x="0" y="98" fill="#94A3B8" font-size="11.5" font-weight="600">ПАРОЛЬ АБО API-ТОКЕН ДОСТУПУ</text>
      <rect x="0" y="108" width="460" height="46" rx="8" fill="#0A0E18" stroke="#1F2937" stroke-width="1.2"/>
      <text font-family="Inter, sans-serif" x="16" y="136" fill="#94A3B8" font-size="16">••••••••••••••••••••••••••••</text>

      <!-- Checkbox & Forgot link -->
      <g transform="translate(0, 172)">
        <rect x="0" y="0" width="16" height="16" rx="4" fill="#6366F1"/>
        <text font-family="Inter, sans-serif" x="8" y="12" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">✓</text>
        <text font-family="Inter, sans-serif" x="26" y="13" fill="#CBD5E1" font-size="12">Запам'ятати мене на цьому пристрої</text>
        <text font-family="Inter, sans-serif" x="460" y="13" fill="#818CF8" font-size="12" font-weight="500" text-anchor="end" cursor="pointer">Забули пароль?</text>
      </g>

      <!-- Big Submit Button -->
      <g transform="translate(0, 212)" cursor="pointer">
        <rect x="0" y="0" width="460" height="48" rx="8" fill="url(#btnGrad)"/>
        <text font-family="Inter, sans-serif" x="230" y="30" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">Увійти до панелі таргетолога</text>
      </g>

      <!-- Security Note -->
      <g transform="translate(0, 285)">
        <text font-family="Inter, sans-serif" x="230" y="16" fill="#64748B" font-size="11" text-anchor="middle">🔒 Захищений сеанс 256-бітним SSL шифруванням • ФІТ УжНУ 2026</text>
      </g>
    </g>
  </g>
</svg>