<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap");
      text { font-family: "Inter", sans-serif; }
    </style>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- App Background -->
  <rect width="1440" height="900" fill="#090D16"/>

  <!-- Left Sidebar -->
  <g id="Sidebar">
    <rect x="0" y="0" width="250" height="900" fill="#0E1422"/>
    <line x1="250" y1="0" x2="250" y2="900" stroke="#1A2336" stroke-width="1"/>

    <!-- Brand Header -->
    <g id="BrandHeader" transform="translate(20, 24)">
      <rect x="0" y="0" width="38" height="38" rx="10" fill="url(#brandGrad)"/>
      <text font-family="Inter, sans-serif" x="19" y="24" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">MkV</text>
      <text font-family="Inter, sans-serif" x="48" y="17" fill="#FFFFFF" font-size="13.5" font-weight="700">MkV Sales Manager</text>
      <text font-family="Inter, sans-serif" x="48" y="32" fill="#94A3B8" font-size="10.5" font-weight="500">CRM • Media Buying OS</text>
    </g>

    <!-- Navigation Section -->
    <text font-family="Inter, sans-serif" x="20" y="108" fill="#64748B" font-size="10" font-weight="700" letter-spacing="1">ОСНОВНЕ МЕНЮ</text>
    
    <g id="Nav_0">
      <rect x="12" y="125" width="226" height="40" rx="8" fill="transparent"/>
      <circle cx="30" cy="145" r="3" fill="#475569"/>
      <text font-family="Inter, sans-serif" x="46" y="150" fill="#94A3B8" font-size="13" font-weight="500">Огляд платформи</text>
    </g>

    <g id="Nav_1">
      <rect x="12" y="173" width="226" height="40" rx="8" fill="transparent"/>
      <circle cx="30" cy="193" r="3" fill="#475569"/>
      <text font-family="Inter, sans-serif" x="46" y="198" fill="#94A3B8" font-size="13" font-weight="500">Дашборд аналітики</text>
    </g>

    <g id="Nav_2_Active">
      <rect x="12" y="221" width="226" height="40" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.2"/>
      <circle cx="30" cy="241" r="4" fill="#6366F1"/>
      <text font-family="Inter, sans-serif" x="46" y="246" fill="#FFFFFF" font-size="13" font-weight="600">ШІ-Студія сценаріїв</text>
    </g>

    <g id="Nav_3">
      <rect x="12" y="269" width="226" height="40" rx="8" fill="transparent"/>
      <circle cx="30" cy="289" r="3" fill="#475569"/>
      <text font-family="Inter, sans-serif" x="46" y="294" fill="#94A3B8" font-size="13" font-weight="500">Кампанії та медіабаїнг</text>
    </g>

    <g id="Nav_4">
      <rect x="12" y="317" width="226" height="40" rx="8" fill="transparent"/>
      <circle cx="30" cy="337" r="3" fill="#475569"/>
      <text font-family="Inter, sans-serif" x="46" y="342" fill="#94A3B8" font-size="13" font-weight="500">Вигорання та хуки</text>
    </g>
    <g id="Nav_Auth">
      <rect x="12" y="395" width="226" height="40" rx="8" fill="transparent" stroke="transparent" stroke-width="1.2"/>
      <circle cx="30" cy="415" r="3" fill="#475569"/>
      <text font-family="Inter, sans-serif" x="46" y="420" fill="#94A3B8" font-size="13" font-weight="500">Авторизація / Вхід</text>
    </g>

    <text font-family="Inter, sans-serif" x="20" y="385" fill="#64748B" font-size="10" font-weight="700" letter-spacing="1">БЕЗПЕКА</text>

    <!-- Student Profile Card at Bottom -->
    <g id="StudentProfile" transform="translate(14, 820)">
      <rect x="0" y="0" width="222" height="56" rx="10" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
      <circle cx="28" cy="28" r="15" fill="#4F46E5"/>
      <text font-family="Inter, sans-serif" x="28" y="33" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">МБ</text>
      <text font-family="Inter, sans-serif" x="52" y="23" fill="#FFFFFF" font-size="12" font-weight="600">Михайло Багин</text>
      <text font-family="Inter, sans-serif" x="52" y="38" fill="#64748B" font-size="10.5">Студент ІПЗ-1 • УжНУ</text>
      <circle cx="206" cy="28" r="3.5" fill="#10B981"/>
    </g>
  </g>

  <!-- Top Navigation Bar -->
  <g id="TopBar">
    <rect x="250" y="0" width="1190" height="64" fill="#0E1422"/>
    <line x1="250" y1="64" x2="1440" y2="64" stroke="#1A2336" stroke-width="1"/>

    <!-- Page Title & Breadcrumb -->
    <g transform="translate(280, 23)">
      <text font-family="Inter, sans-serif" x="0" y="16" fill="#FFFFFF" font-size="16" font-weight="700">Креативна ШІ-студія (AI Creative Studio)</text>
      <text font-family="Inter, sans-serif" x="0" y="32" fill="#64748B" font-size="11">MkV CRM / Креативна ШІ-студія (AI Creative Studio)</text>
    </g>

    <!-- Search Box -->
    <g transform="translate(810, 16)">
      <rect x="0" y="0" width="180" height="34" rx="8" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
      <text font-family="Inter, sans-serif" x="14" y="21" fill="#64748B" font-size="11.5">🔍 Пошук...</text>
    </g>

    <!-- Active Platforms Badges -->
    <g transform="translate(1005, 16)">
      <!-- Meta badge -->
      <rect x="0" y="0" width="105" height="34" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
      <circle cx="16" cy="17" r="3.5" fill="#10B981"/>
      <text font-family="Inter, sans-serif" x="26" y="21" fill="#E2E8F0" font-size="11" font-weight="600">Meta Ads</text>

      <!-- TikTok badge -->
      <rect x="115" y="0" width="105" height="34" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
      <circle cx="131" cy="17" r="3.5" fill="#10B981"/>
      <text font-family="Inter, sans-serif" x="141" y="21" fill="#E2E8F0" font-size="11" font-weight="600">TikTok Ads</text>

      <!-- Date Filter -->
      <rect x="230" y="0" width="165" height="34" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
      <text font-family="Inter, sans-serif" x="245" y="21" fill="#CBD5E1" font-size="11" font-weight="500">📅 Останні 30 днів</text>
    </g>
  </g>

  <!-- Main Content -->
  <g id="MainContent" transform="translate(280, 84)">
    
    <!-- 2 Column Layout: Left Generator Form + Right Visual Storyboard -->
    <g id="StudioLayout">
      <!-- Left Column: Generator Form -->
      <g id="GeneratorForm" transform="translate(0, 0)">
        <rect x="0" y="0" width="370" height="775" rx="14" fill="#131B2E" stroke="#1E293B" stroke-width="1.2"/>
        
        <text font-family="Inter, sans-serif" x="24" y="36" fill="#FFFFFF" font-size="16" font-weight="700">ШІ-Генератор сценаріїв</text>
        <text font-family="Inter, sans-serif" x="24" y="54" fill="#64748B" font-size="11.5">Автоматичний розрахунок таймлайну</text>

        <!-- Input 1: Product -->
        <g transform="translate(24, 80)">
          <text font-family="Inter, sans-serif" x="0" y="14" fill="#94A3B8" font-size="11.5" font-weight="600">ПРОДУКТ ЧИ ПОСЛУГА</text>
          <rect x="0" y="22" width="322" height="42" rx="8" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
          <text font-family="Inter, sans-serif" x="14" y="48" fill="#FFFFFF" font-size="12.5">Натуральна сироватка для обличчя</text>
        </g>

        <!-- Input 2: Platform -->
        <g transform="translate(24, 160)">
          <text font-family="Inter, sans-serif" x="0" y="14" fill="#94A3B8" font-size="11.5" font-weight="600">ФОРМАТ ВІДЕО</text>
          <rect x="0" y="22" width="322" height="42" rx="8" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
          <text font-family="Inter, sans-serif" x="14" y="48" fill="#FFFFFF" font-size="12.5">TikTok / Reels (9:16 Вертикальне) ▾</text>
        </g>

        <!-- Input 3: Hook Style -->
        <g transform="translate(24, 240)">
          <text font-family="Inter, sans-serif" x="0" y="14" fill="#94A3B8" font-size="11.5" font-weight="600">ТИП ХУКА (ПЕРШІ 3 СЕКУНДИ)</text>
          <rect x="0" y="22" width="322" height="42" rx="8" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
          <text font-family="Inter, sans-serif" x="14" y="48" fill="#FFFFFF" font-size="12.5">Проблема → Рішення (Problem-Solution) ▾</text>
        </g>

        <!-- Input 4: Tone -->
        <g transform="translate(24, 320)">
          <text font-family="Inter, sans-serif" x="0" y="14" fill="#94A3B8" font-size="11.5" font-weight="600">ТОНАЛЬНІСТЬ ОЗВУЧКИ</text>
          <rect x="0" y="22" width="322" height="42" rx="8" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
          <text font-family="Inter, sans-serif" x="14" y="48" fill="#FFFFFF" font-size="12.5">Дружня, експертна, без реклами в лоб ▾</text>
        </g>

        <!-- Submit Button -->
        <g transform="translate(24, 400)">
          <rect x="0" y="0" width="322" height="46" rx="8" fill="url(#btnGrad)"/>
          <text font-family="Inter, sans-serif" x="161" y="28" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">⚡ Згенерувати розкадровку</text>
        </g>

        <!-- Saved Presets Box -->
        <g transform="translate(24, 480)">
          <text font-family="Inter, sans-serif" x="0" y="14" fill="#64748B" font-size="10.5" font-weight="700">ЗБЕРЕЖЕНІ СЦЕНАРІЇ В РОБОТІ</text>
          
          <rect x="0" y="24" width="322" height="50" rx="8" fill="#0E1422" stroke="#1A2336" stroke-width="1"/>
          <text font-family="Inter, sans-serif" x="14" y="45" fill="#FFFFFF" font-size="12" font-weight="600">EcoCosmetics_Hook_01</text>
          <text font-family="Inter, sans-serif" x="14" y="62" fill="#64748B" font-size="10">Створено сьогодні • 20с ролик</text>
          <text font-family="Inter, sans-serif" x="300" y="52" fill="#818CF8" font-size="11" font-weight="600" text-anchor="end">Активний ✓</text>

          <rect x="0" y="84" width="322" height="50" rx="8" fill="#0E1422" stroke="#1A2336" stroke-width="1"/>
          <text font-family="Inter, sans-serif" x="14" y="105" fill="#CBD5E1" font-size="12" font-weight="600">Serum_Curiosity_Test</text>
          <text font-family="Inter, sans-serif" x="14" y="122" fill="#64748B" font-size="10">Вчора • 15с ролик</text>
          <text font-family="Inter, sans-serif" x="300" y="112" fill="#64748B" font-size="11" text-anchor="end">Чернетка</text>
        </g>
      </g>

      <!-- Right Column: Visual Storyboard -->
      <g id="StoryboardView" transform="translate(395, 0)">
        <rect x="0" y="0" width="725" height="775" rx="14" fill="#131B2E" stroke="#1E293B" stroke-width="1.2"/>
        
        <text font-family="Inter, sans-serif" x="28" y="36" fill="#FFFFFF" font-size="16" font-weight="700">Готова розкадровка: «EcoCosmetics — Ранковий догляд»</text>
        <text font-family="Inter, sans-serif" x="28" y="54" fill="#10B981" font-size="12">● Готово до зйомки та монтажу (тривалість 20 секунд)</text>

        <!-- Scene 1: Hook (0-3s) -->
        <g id="Scene_1" transform="translate(28, 80)">
          <rect x="0" y="0" width="670" height="180" rx="10" fill="#0A0E18" stroke="#6366F1" stroke-width="1.2"/>
          <rect x="18" y="16" width="90" height="22" rx="4" fill="rgba(99, 102, 241, 0.2)"/>
          <text font-family="Inter, sans-serif" x="63" y="31" fill="#818CF8" font-size="11" font-weight="700" text-anchor="middle">СЦЕНА 1 (0–3с)</text>
          <text font-family="Inter, sans-serif" x="120" y="32" fill="#FFFFFF" font-size="13" font-weight="700">Хук (Привернення 80% уваги)</text>

          <text font-family="Inter, sans-serif" x="18" y="62" fill="#64748B" font-size="10" font-weight="700">ВІЗУАЛ НА ЕКРАНІ:</text>
          <text font-family="Inter, sans-serif" x="18" y="80" fill="#CBD5E1" font-size="12">Крупний план обличчя в дзеркалі, дівчина розчаровано змиває водою звичайний крем.</text>

          <text font-family="Inter, sans-serif" x="18" y="112" fill="#64748B" font-size="10" font-weight="700">ТЕКСТ НА ВІДЕО ТА ОЗВУЧКА:</text>
          <text font-family="Inter, sans-serif" x="18" y="130" fill="#F8FAFC" font-size="12.5" font-weight="500">«Чому твій крем забиває пори, а не зволожує? Якщо шкіра досі тьмяна — викинь його...»</text>

          <rect x="18" y="145" width="130" height="20" rx="4" fill="#1E293B"/>
          <text font-family="Inter, sans-serif" x="83" y="159" fill="#38BDF8" font-size="10" font-weight="600" text-anchor="middle">Hold Rate ціль: &gt; 40%</text>
        </g>

        <!-- Scene 2: Problem & Solution (4-14s) -->
        <g id="Scene_2" transform="translate(28, 275)">
          <rect x="0" y="0" width="670" height="180" rx="10" fill="#0A0E18" stroke="#1E293B" stroke-width="1.2"/>
          <rect x="18" y="16" width="95" height="22" rx="4" fill="rgba(168, 85, 247, 0.2)"/>
          <text font-family="Inter, sans-serif" x="65" y="31" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">СЦЕНА 2 (4–14с)</text>
          <text font-family="Inter, sans-serif" x="125" y="32" fill="#FFFFFF" font-size="13" font-weight="700">Демонстрація проблеми та засобу</text>

          <text font-family="Inter, sans-serif" x="18" y="62" fill="#64748B" font-size="10" font-weight="700">ВІЗУАЛ НА ЕКРАНІ:</text>
          <text font-family="Inter, sans-serif" x="18" y="80" fill="#CBD5E1" font-size="12">Кадр з текстурою легкої сироватки з пептидами. Швидке вбирання, миттєве сяйво без липкості.</text>

          <text font-family="Inter, sans-serif" x="18" y="112" fill="#64748B" font-size="10" font-weight="700">ТЕКСТ НА ВІДЕО ТА ОЗВУЧКА:</text>
          <text font-family="Inter, sans-serif" x="18" y="130" fill="#F8FAFC" font-size="12.5" font-weight="500">«100% рослинні пептиди проникають глибоко в дерму. Замінює 3 звичайні баночки щоранку.»</text>

          <rect x="18" y="145" width="160" height="20" rx="4" fill="#1E293B"/>
          <text font-family="Inter, sans-serif" x="98" y="159" fill="#A855F7" font-size="10" font-weight="600" text-anchor="middle">Демонстрація продукту</text>
        </g>

        <!-- Scene 3: CTA (15-20s) -->
        <g id="Scene_3" transform="translate(28, 470)">
          <rect x="0" y="0" width="670" height="180" rx="10" fill="#0A0E18" stroke="#10B981" stroke-width="1.2"/>
          <rect x="18" y="16" width="105" height="22" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
          <text font-family="Inter, sans-serif" x="70" y="31" fill="#34D399" font-size="11" font-weight="700" text-anchor="middle">СЦЕНА 3 (15–20с)</text>
          <text font-family="Inter, sans-serif" x="135" y="32" fill="#FFFFFF" font-size="13" font-weight="700">Заклик до дії (Конверсія / Офер)</text>

          <text font-family="Inter, sans-serif" x="18" y="62" fill="#64748B" font-size="10" font-weight="700">ВІЗУАЛ НА ЕКРАНІ:</text>
          <text font-family="Inter, sans-serif" x="18" y="80" fill="#CBD5E1" font-size="12">Фірмова баночка поруч зі стрілкою на кнопку замовлення. Плашка зі знижкою -25%.</text>

          <text font-family="Inter, sans-serif" x="18" y="112" fill="#64748B" font-size="10" font-weight="700">ТЕКСТ НА ВІДЕО ТА ОЗВУЧКА:</text>
          <text font-family="Inter, sans-serif" x="18" y="130" fill="#F8FAFC" font-size="12.5" font-weight="500">«Тисни на посилання під відео та забирай набір зі знижкою 25% і безкоштовною доставкою!»</text>

          <rect x="18" y="145" width="140" height="20" rx="4" fill="#064E3B"/>
          <text font-family="Inter, sans-serif" x="88" y="159" fill="#34D399" font-size="10" font-weight="600" text-anchor="middle">Офер: Знижка -25%</text>
        </g>

        <!-- Audio Player Strip -->
        <g id="AudioPlayer" transform="translate(28, 675)">
          <rect x="0" y="0" width="670" height="65" rx="10" fill="#0E1422" stroke="#1E293B" stroke-width="1"/>
          <circle cx="36" cy="32" r="16" fill="#6366F1"/>
          <text font-family="Inter, sans-serif" x="38" y="37" fill="#FFFFFF" font-size="13" text-anchor="middle">▶</text>
          <text font-family="Inter, sans-serif" x="66" y="27" fill="#FFFFFF" font-size="12" font-weight="600">Дикторська озвучка (AI Voice)</text>
          <text font-family="Inter, sans-serif" x="66" y="44" fill="#64748B" font-size="10.5">Голос: Оксана (Укр - Природний) • 0:00 / 0:20</text>
          <line x1="300" y1="32" x2="640" y2="32" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
          <line x1="300" y1="32" x2="420" y2="32" stroke="#6366F1" stroke-width="4" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>