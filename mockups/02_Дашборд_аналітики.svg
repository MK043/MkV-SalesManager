        <text font-family="Inter, sans-serif" x="700" y="0">20 Лист</text>
        <text font-family="Inter, sans-serif" x="860" y="0">25 Лист</text>
        <text font-family="Inter, sans-serif" x="1020" y="0">30 Лист</text>
