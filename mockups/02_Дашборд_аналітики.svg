      <text font-family="Inter, sans-serif" x="35" y="154" fill="#475569" font-size="11" text-anchor="end">75</text>

      <line x1="50" y1="210" x2="1080" y2="210" stroke="#1A2336" stroke-width="1" stroke-dasharray="4 4"/>
