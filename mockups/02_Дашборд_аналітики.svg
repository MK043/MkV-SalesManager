        <text font-family="Inter, sans-serif" x="16" y="24" fill="#FFFFFF" font-size="12.5" font-weight="600">Retargeting_AbandonedCart</text>
        <rect x="280" y="10" width="75" height="20" rx="4" fill="#18233C"/>
        <text font-family="Inter, sans-serif" x="317" y="24" fill="#818CF8" font-size="10.5" font-weight="600" text-anchor="middle">Meta Ads</text>
        <text font-family="Inter, sans-serif" x="430" y="24" fill="#CBD5E1" font-size="12">$50/день</text>
        <text font-family="Inter, sans-serif" x="580" y="24" fill="#CBD5E1" font-size="12">$1,420</text>
        <text font-family="Inter, sans-serif" x="720" y="24" fill="#FFFFFF" font-size="12.5" font-weight="700">185</text>
        <text font-family="Inter, sans-serif" x="840" y="24" fill="#10B981" font-size="13" font-weight="700">4.80x</text>
        <rect x="970" y="10" width="70" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
        <text font-family="Inter, sans-serif" x="1005" y="24" fill="#34D399" font-size="10.5" font-weight="700" text-anchor="middle">Активна</text>
        <line x1="0" y1="42" x2="1072" y2="42" stroke="#1A2336" stroke-width="1"/>
      </g>

      <!-- Row 4 -->
      <g transform="translate(24, 246)">
        <text font-family="Inter, sans-serif" x="16" y="24" fill="#FFFFFF" font-size="12.5" font-weight="600">Lookalike_Broad_PL</text>
        <rect x="280" y="10" width="75" height="20" rx="4" fill="#18233C"/>
        <text font-family="Inter, sans-serif" x="317" y="24" fill="#818CF8" font-size="10.5" font-weight="600" text-anchor="middle">Meta Ads</text>
        <text font-family="Inter, sans-serif" x="430" y="24" fill="#CBD5E1" font-size="12">$70/день</text>
        <text font-family="Inter, sans-serif" x="580" y="24" fill="#CBD5E1" font-size="12">$1,890</text>
        <text font-family="Inter, sans-serif" x="720" y="24" fill="#FFFFFF" font-size="12.5" font-weight="700">114</text>
        <text font-family="Inter, sans-serif" x="840" y="24" fill="#FBBF24" font-size="13" font-weight="700">2.45x</text>
