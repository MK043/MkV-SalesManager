        <text font-family="Inter, sans-serif" x="16" y="24" fill="#FFFFFF" font-size="12.5" font-weight="600">EcoCream_Scale_EU</text>
        <rect x="280" y="10" width="75" height="20" rx="4" fill="#18233C"/>
        <text font-family="Inter, sans-serif" x="317" y="24" fill="#818CF8" font-size="10.5" font-weight="600" text-anchor="middle">Meta Ads</text>
        <text font-family="Inter, sans-serif" x="430" y="24" fill="#CBD5E1" font-size="12">$120/день</text>
        <text font-family="Inter, sans-serif" x="580" y="24" fill="#CBD5E1" font-size="12">$3,450</text>
        <text font-family="Inter, sans-serif" x="720" y="24" fill="#FFFFFF" font-size="12.5" font-weight="700">312</text>
        <text font-family="Inter, sans-serif" x="840" y="24" fill="#10B981" font-size="13" font-weight="700">4.12x</text>
        <rect x="970" y="10" width="70" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
