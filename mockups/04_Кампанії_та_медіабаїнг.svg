      <text font-family="Inter, sans-serif" x="19" y="24" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">MkV</text>
      <text font-family="Inter, sans-serif" x="48" y="17" fill="#FFFFFF" font-size="13.5" font-weight="700">MkV Sales Manager</text>
      <text font-family="Inter, sans-serif" x="48" y="32" fill="#94A3B8" font-size="10.5" font-weight="500">CRM • Media Buying OS</text>
    </g>

    <!-- Navigation Section -->
    <text font-family="Inter, sans-serif" x="20" y="108" fill="#64748B" font-size="10" font-weight="700" letter-spacing="1">ОСНОВНЕ МЕНЮ</text>
    
    <g id="Nav_0">
      <rect x="12" y="125" width="226" height="40" rx="8" fill="transparent"/>
      <circle cx="30" cy="145" r="3" fill="#475569"/>
      <text font-family="Inter, sans-serif" x="46" y="150" fill="#94A3B8" font-size="13" font-weight="500">Огляд платформи</text>
    </g>

    <g id="Nav_1">
