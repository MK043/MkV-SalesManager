        <circle cx="1003" cy="21" r="8" fill="#FFFFFF"/>
        <line x1="0" y1="42" x2="1072" y2="42" stroke="#1A2336" stroke-width="1"/>
      </g>

      <!-- Row 2 -->
      <g transform="translate(24, 150)">
        <text font-family="Inter, sans-serif" x="16" y="24" fill="#FFFFFF" font-size="12.5" font-weight="600">TikTok_Spark_TopHook</text>
        <rect x="290" y="10" width="85" height="20" rx="4" fill="#064E3B"/>
        <text font-family="Inter, sans-serif" x="332" y="24" fill="#34D399" font-size="10.5" font-weight="600" text-anchor="middle">TikTok Ads</text>
        <text font-family="Inter, sans-serif" x="430" y="24" fill="#CBD5E1" font-size="12">$100.00 / день</text>
        <text font-family="Inter, sans-serif" x="590" y="24" fill="#CBD5E1" font-size="12">$2,650.00</text>
        <text font-family="Inter, sans-serif" x="720" y="24" fill="#10B981" font-size="12.5" font-weight="600">$9.80</text>
        <text font-family="Inter, sans-serif" x="840" y="24" fill="#10B981" font-size="13" font-weight="700">4.50x</text>
        <!-- Toggle Switch Active -->
        <rect x="970" y="10" width="44" height="22" rx="11" fill="#10B981"/>
        <circle cx="1003" cy="21" r="8" fill="#FFFFFF"/>
        <line x1="0" y1="42" x2="1072" y2="42" stroke="#1A2336" stroke-width="1"/>
      </g>

      <!-- Row 3 -->
      <g transform="translate(24, 202)">
        <text font-family="Inter, sans-serif" x="16" y="24" fill="#FFFFFF" font-size="12.5" font-weight="600">Retargeting_Catalog_UA</text>
        <rect x="290" y="10" width="75" height="20" rx="4" fill="#18233C"/>
        <text font-family="Inter, sans-serif" x="327" y="24" fill="#818CF8" font-size="10.5" font-weight="600" text-anchor="middle">Meta Ads</text>
        <text font-family="Inter, sans-serif" x="430" y="24" fill="#CBD5E1" font-size="12">$60.00 / день</text>
        <text font-family="Inter, sans-serif" x="590" y="24" fill="#CBD5E1" font-size="12">$1,280.00</text>
        <text font-family="Inter, sans-serif" x="720" y="24" fill="#38BDF8" font-size="12.5" font-weight="600">$12.10</text>
        <text font-family="Inter, sans-serif" x="840" y="24" fill="#10B981" font-size="13" font-weight="700">3.80x</text>
