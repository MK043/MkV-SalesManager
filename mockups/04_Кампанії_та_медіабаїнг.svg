        <text font-family="Inter, sans-serif" x="327" y="24" fill="#818CF8" font-size="10.5" font-weight="600" text-anchor="middle">Meta Ads</text>
        <text font-family="Inter, sans-serif" x="430" y="24" fill="#CBD5E1" font-size="12">$150.00 / день</text>
        <text font-family="Inter, sans-serif" x="590" y="24" fill="#CBD5E1" font-size="12">$4,120.00</text>
        <text font-family="Inter, sans-serif" x="720" y="24" fill="#10B981" font-size="12.5" font-weight="600">$10.40</text>
        <text font-family="Inter, sans-serif" x="840" y="24" fill="#10B981" font-size="13" font-weight="700">4.20x</text>
        <!-- Toggle Switch Active -->
