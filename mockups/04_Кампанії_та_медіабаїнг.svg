        <text font-family="Inter, sans-serif" x="290" y="23" fill="#64748B" font-size="11" font-weight="700">ПЛАТФОРМА</text>
        <text font-family="Inter, sans-serif" x="430" y="23" fill="#64748B" font-size="11" font-weight="700">ДОБОВИЙ БЮДЖЕТ</text>
