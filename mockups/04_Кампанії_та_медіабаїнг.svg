        <text font-family="Inter, sans-serif" x="16" y="24" fill="#CBD5E1" font-size="12.5" font-weight="500">Old_Creative_Test_PL</text>
        <rect x="290" y="10" width="75" height="20" rx="4" fill="#18233C"/>
        <text font-family="Inter, sans-serif" x="327" y="24" fill="#818CF8" font-size="10.5" font-weight="600" text-anchor="middle">Meta Ads</text>
        <text font-family="Inter, sans-serif" x="430" y="24" fill="#64748B" font-size="12">$30.00 / день</text>
        <text font-family="Inter, sans-serif" x="590" y="24" fill="#64748B" font-size="12">$420.00</text>
        <text font-family="Inter, sans-serif" x="720" y="24" fill="#64748B" font-size="12.5">$16.20</text>
        <text font-family="Inter, sans-serif" x="840" y="24" fill="#64748B" font-size="13">2.10x</text>
