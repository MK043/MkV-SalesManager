        <text font-family="Inter, sans-serif" x="840" y="23" fill="#64748B" font-size="11" font-weight="700">ROAS</text>
        <text font-family="Inter, sans-serif" x="970" y="23" fill="#64748B" font-size="11" font-weight="700">ТОГЛ ON/OFF</text>
