        <rect x="290" y="10" width="85" height="20" rx="4" fill="#064E3B"/>
        <text font-family="Inter, sans-serif" x="332" y="24" fill="#34D399" font-size="10.5" font-weight="600" text-anchor="middle">TikTok Ads</text>
        <text font-family="Inter, sans-serif" x="430" y="24" fill="#CBD5E1" font-size="12">$50.00 / день</text>
        <text font-family="Inter, sans-serif" x="590" y="24" fill="#CBD5E1" font-size="12">$840.00</text>
        <text font-family="Inter, sans-serif" x="720" y="24" fill="#F87171" font-size="12.5" font-weight="600">$18.90</text>
        <text font-family="Inter, sans-serif" x="840" y="24" fill="#F87171" font-size="13" font-weight="700">1.80x</text>
