    <!-- Bottom Rules Panel (2 cards) -->
    <g id="AutoRulesPanel" transform="translate(0, 455)">
      <text font-family="Inter, sans-serif" x="0" y="20" fill="#FFFFFF" font-size="15" font-weight="700">Автоматичні правила захисту бюджету (Auto-Rules)</text>
      
      <!-- Rule 1: CPA Threshold -->
      <g id="Rule_CPA" transform="translate(0, 36)">
        <rect x="0" y="0" width="545" height="150" rx="12" fill="#131B2E" stroke="#1E293B" stroke-width="1.2"/>
        <rect x="20" y="20" width="34" height="34" rx="8" fill="rgba(239, 68, 68, 0.15)"/>
        <text font-family="Inter, sans-serif" x="37" y="42" fill="#F87171" font-size="16" text-anchor="middle">🛡️</text>
        <text font-family="Inter, sans-serif" x="66" y="34" fill="#FFFFFF" font-size="14" font-weight="700">Захист від зливу: CPA Guard (&gt; $15.00)</text>
        <text font-family="Inter, sans-serif" x="66" y="50" fill="#64748B" font-size="11">Автоматична зупинка нерентабельних оголошень</text>

        <text font-family="Inter, sans-serif" x="20" y="86" fill="#94A3B8" font-size="12">Умова: якщо за останні 6 годин вартість заявки перевищує $15.00, кампанія миттєво ставиться на паузу без участі таргетолога.</text>

        <rect x="20" y="108" width="120" height="24" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
        <text font-family="Inter, sans-serif" x="80" y="124" fill="#34D399" font-size="11" font-weight="600" text-anchor="middle">Врятовано: $340</text>

        <rect x="470" y="24" width="44" height="22" rx="11" fill="#10B981"/>
        <circle cx="503" cy="35" r="8" fill="#FFFFFF"/>
      </g>

      <!-- Rule 2: Scaling -->
      <g id="Rule_Scale" transform="translate(575, 36)">
        <rect x="0" y="0" width="545" height="150" rx="12" fill="#131B2E" stroke="#1E293B" stroke-width="1.2"/>
        <rect x="20" y="20" width="34" height="34" rx="8" fill="rgba(16, 185, 129, 0.15)"/>
        <text font-family="Inter, sans-serif" x="37" y="42" fill="#34D399" font-size="16" text-anchor="middle">📈</text>
        <text font-family="Inter, sans-serif" x="66" y="34" fill="#FFFFFF" font-size="14" font-weight="700">Авто-масштабування: ROAS Scaler (&gt; 4.0x)</text>
        <text font-family="Inter, sans-serif" x="66" y="50" fill="#64748B" font-size="11">Збільшення денного бюджету при високій окупності</text>

        <text font-family="Inter, sans-serif" x="20" y="86" fill="#94A3B8" font-size="12">Умова: якщо кампанія приносить ROAS понад 4.0x при мінімум 10 конверсіях, добовий бюджет автоматично збільшується на +20%.</text>

        <rect x="20" y="108" width="140" height="24" rx="4" fill="rgba(99, 102, 241, 0.15)"/>
        <text font-family="Inter, sans-serif" x="90" y="124" fill="#818CF8" font-size="11" font-weight="600" text-anchor="middle">Приріст лідів: +18%</text>

        <rect x="470" y="24" width="44" height="22" rx="11" fill="#10B981"/>
        <circle cx="503" cy="35" r="8" fill="#FFFFFF"/>
      </g>
    </g>
