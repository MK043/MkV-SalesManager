    <circle cx="304" cy="668" r="7" fill="#065F46"/>
    <text x="304" y="671.5" fill="#34D399" font-size="9" font-weight="800" text-anchor="middle">✓</text>
    <text x="320" y="667" fill="#FFFFFF" font-size="11" font-weight="600">1. Повноцінний набір ассетів (Asset Group)</text>
