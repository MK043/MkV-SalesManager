    <text x="377.0" y="613" fill="#FFFFFF" font-size="13" font-weight="700">Google Performance Max (PMax) Checklist</text>
    <text x="805" y="613" fill="#10B981" font-size="11.5" font-weight="700" text-anchor="end">3/3 (100%)</text>
    <rect x="288" y="626" width="519" height="4" rx="2" fill="#1F2937"/>
