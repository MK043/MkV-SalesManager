    <text x="895" y="292" fill="#FFFFFF" font-size="11" font-weight="600">1. Авторизація відео через TikTok Creator Marketplace</text>
    <text x="895" y="311" fill="#64748B" font-size="9.5">Увімкнення тумблера «Рекламна авторизація» у застосунку автора та отримання 16-значного Spark Code.</text>
    <rect x="863" y="341" width="519" height="64" rx="6" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
    <circle cx="879" cy="365" r="7" fill="#065F46"/>
    <text x="879" y="368.5" fill="#34D399" font-size="9" font-weight="800" text-anchor="middle">✓</text>
    <text x="895" y="364" fill="#FFFFFF" font-size="11" font-weight="600">2. Синхронізація в TikTok Commercial API</text>
    <text x="895" y="383" fill="#64748B" font-size="9.5">Імпорт відеопоста у рекламний кабінет через API MkV Sales Manager зі збереженням органічних уподобань.</text>
    <rect x="863" y="413" width="519" height="64" rx="6" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
    <circle cx="879" cy="437" r="7" fill="#1F2937" stroke="#475569" stroke-width="1"/>
    <text x="895" y="436" fill="#FFFFFF" font-size="11" font-weight="600">3. Налаштування закріпленого інтерактивного стікера</text>
    <text x="895" y="455" fill="#64748B" font-size="9.5">Додавання анімованого клікабельного стікера або кнопки переходу на лендінг з промокодом.</text>
  </g>
  <g id="Checklist-Google_Performance_Max__PMax__Checklist">
