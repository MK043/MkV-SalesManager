<g id="MainContent">
  <text x="270" y="132" fill="#818CF8" font-size="11" font-weight="700">ІНТЕРАКТИВНІ ІНСТРУКЦІЇ • РОЗДІЛ 1 ТА 2.2 РОБОТИ</text>
  <text x="270" y="160" fill="#FFFFFF" font-size="22" font-weight="800">Advertising Knowledge Base &amp; Setup Guides</text>
  <text x="270" y="180" fill="#94A3B8" font-size="11.5">Покрокові інтерактивні чеклисти Meta CAPI, TikTok Spark Ads, Google PMax та модуль усунення типових блокувань.</text>
  <rect x="1050" y="142" width="150" height="36" rx="7" fill="#18233C" stroke="#2D3E5D" stroke-width="1"/>
  <text x="1125" y="165" fill="#E2E8F0" font-size="11.5" font-weight="600" text-anchor="middle">Експорт чеклиста</text>
  <rect x="1212" y="142" width="188" height="36" rx="7" fill="#4F46E5"/>
  <text x="1306" y="165" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle">Перевірити Match Rate</text>
  <g id="Checklist-Meta_CAPI___Server-Side_Pixel_Setup">
    <rect x="270" y="205" width="555" height="355" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1.2"/>
    <rect x="288" y="223" width="66.0" height="20" rx="4" fill="#1E3A8A"/>
    <text x="321.0" y="236.5" fill="#60A5FA" font-size="9.5" font-weight="700" text-anchor="middle">Meta Ads</text>
    <text x="364.0" y="238" fill="#FFFFFF" font-size="13" font-weight="700">Meta CAPI &amp; Server-Side Pixel Setup</text>
    <text x="805" y="238" fill="#38BDF8" font-size="11.5" font-weight="700" text-anchor="end">3/4 (75%)</text>
    <rect x="288" y="251" width="519" height="4" rx="2" fill="#1F2937"/>
    <rect x="288" y="251" width="389.25" height="4" rx="2" fill="#38BDF8"/>
    <rect x="288" y="269" width="519" height="64" rx="6" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
    <circle cx="304" cy="293" r="7" fill="#065F46"/>
    <text x="304" y="296.5" fill="#34D399" font-size="9" font-weight="800" text-anchor="middle">✓</text>
    <text x="320" y="292" fill="#FFFFFF" font-size="11" font-weight="600">1. Серверний контейнер (Server Side GTM / Cloud Gateway)</text>
    <text x="320" y="311" fill="#64748B" font-size="9.5">Розгортання проксі-сервера на субдомені (напр., data.brand.com) для обходу блокувальників AdBlock та Safari ITP.</text>
    <rect x="288" y="341" width="519" height="64" rx="6" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
    <circle cx="304" cy="365" r="7" fill="#065F46"/>
    <text x="304" y="368.5" fill="#34D399" font-size="9" font-weight="800" text-anchor="middle">✓</text>
    <text x="320" y="364" fill="#FFFFFF" font-size="11" font-weight="600">2. Генерація System User Token у Business Manager</text>
    <text x="320" y="383" fill="#64748B" font-size="9.5">Створення постійного токена доступу з правами ads_management та передача у MkV Sales Manager CRM.</text>
    <rect x="288" y="413" width="519" height="64" rx="6" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
    <circle cx="304" cy="437" r="7" fill="#065F46"/>
    <text x="304" y="440.5" fill="#34D399" font-size="9" font-weight="800" text-anchor="middle">✓</text>
    <text x="320" y="436" fill="#FFFFFF" font-size="11" font-weight="600">3. Дедуплікація подій (Event Deduplication)</text>
    <text x="320" y="455" fill="#64748B" font-size="9.5">Передача однакового event_id з браузерного пікселя та сервера, щоб уникнути подвійного обліку конверсій.</text>
    <rect x="288" y="485" width="519" height="64" rx="6" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
    <circle cx="304" cy="509" r="7" fill="#1F2937" stroke="#475569" stroke-width="1"/>
    <text x="320" y="508" fill="#FFFFFF" font-size="11" font-weight="600">4. Aggregated Event Measurement (AEM) та валідація домену</text>
    <text x="320" y="527" fill="#64748B" font-size="9.5">Пріоритезація 8 основних подій покупки згідно з протоколами iOS 14.5+.</text>
  </g>
  <g id="Checklist-TikTok_Spark_Ads___Creator_Linking">
