<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap");
      text { font-family: "Inter", sans-serif; }
    </style>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- App Background -->
  <rect width="1440" height="900" fill="#090D16"/>

  <!-- Left Sidebar -->
  <g id="Sidebar">
    <rect x="0" y="0" width="250" height="900" fill="#0E1422"/>
    <line x1="250" y1="0" x2="250" y2="900" stroke="#1A2336" stroke-width="1"/>

    <!-- Brand Header -->
    <g id="BrandHeader" transform="translate(20, 24)">
      <rect x="0" y="0" width="38" height="38" rx="10" fill="url(#brandGrad)"/>
      <text font-family="Inter, sans-serif" x="19" y="24" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">MkV</text>
      <text font-family="Inter, sans-serif" x="48" y="17" fill="#FFFFFF" font-size="13.5" font-weight="700">MkV Sales Manager</text>
      <text font-family="Inter, sans-serif" x="48" y="32" fill="#94A3B8" font-size="10.5" font-weight="500">CRM • Media Buying OS</text>
    </g>

    <!-- Navigation Section -->
    <text font-family="Inter, sans-serif" x="20" y="108" fill="#64748B" font-size="10" font-weight="700" letter-spacing="1">ОСНОВНЕ МЕНЮ</text>
    
    <g id="Nav_0_Active">
      <rect x="12" y="125" width="226" height="40" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.2"/>
      <circle cx="30" cy="145" r="4" fill="#6366F1"/>
      <text font-family="Inter, sans-serif" x="46" y="150" fill="#FFFFFF" font-size="13" font-weight="600">Огляд платформи</text>
    </g>

    <g id="Nav_1">
      <rect x="12" y="173" width="226" height="40" rx="8" fill="transparent"/>
      <circle cx="30" cy="193" r="3" fill="#475569"/>
      <text font-family="Inter, sans-serif" x="46" y="198" fill="#94A3B8" font-size="13" font-weight="500">Дашборд аналітики</text>
    </g>

    <g id="Nav_2">
      <rect x="12" y="221" width="226" height="40" rx="8" fill="transparent"/>
      <circle cx="30" cy="241" r="3" fill="#475569"/>
      <text font-family="Inter, sans-serif" x="46" y="246" fill="#94A3B8" font-size="13" font-weight="500">ШІ-Студія сценаріїв</text>
    </g>

    <g id="Nav_3">
      <rect x="12" y="269" width="226" height="40" rx="8" fill="transparent"/>
      <circle cx="30" cy="289" r="3" fill="#475569"/>
      <text font-family="Inter, sans-serif" x="46" y="294" fill="#94A3B8" font-size="13" font-weight="500">Кампанії та медіабаїнг</text>
    </g>

    <g id="Nav_4">
      <rect x="12" y="317" width="226" height="40" rx="8" fill="transparent"/>
      <circle cx="30" cy="337" r="3" fill="#475569"/>
      <text font-family="Inter, sans-serif" x="46" y="342" fill="#94A3B8" font-size="13" font-weight="500">Вигорання та хуки</text>
    </g>
    <g id="Nav_Auth">
      <rect x="12" y="395" width="226" height="40" rx="8" fill="transparent" stroke="transparent" stroke-width="1.2"/>
      <circle cx="30" cy="415" r="3" fill="#475569"/>
      <text font-family="Inter, sans-serif" x="46" y="420" fill="#94A3B8" font-size="13" font-weight="500">Авторизація / Вхід</text>
    </g>

    <text font-family="Inter, sans-serif" x="20" y="385" fill="#64748B" font-size="10" font-weight="700" letter-spacing="1">БЕЗПЕКА</text>

    <!-- Student Profile Card at Bottom -->
    <g id="StudentProfile" transform="translate(14, 820)">
      <rect x="0" y="0" width="222" height="56" rx="10" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
      <circle cx="28" cy="28" r="15" fill="#4F46E5"/>
      <text font-family="Inter, sans-serif" x="28" y="33" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">МБ</text>
      <text font-family="Inter, sans-serif" x="52" y="23" fill="#FFFFFF" font-size="12" font-weight="600">Михайло Багин</text>
      <text font-family="Inter, sans-serif" x="52" y="38" fill="#64748B" font-size="10.5">Студент ІПЗ-1 • УжНУ</text>
      <circle cx="206" cy="28" r="3.5" fill="#10B981"/>
    </g>
  </g>

  <!-- Top Navigation Bar -->
  <g id="TopBar">
    <rect x="250" y="0" width="1190" height="64" fill="#0E1422"/>
    <line x1="250" y1="64" x2="1440" y2="64" stroke="#1A2336" stroke-width="1"/>

    <!-- Page Title & Breadcrumb -->
    <g transform="translate(280, 23)">
      <text font-family="Inter, sans-serif" x="0" y="16" fill="#FFFFFF" font-size="16" font-weight="700">Головний огляд платформи (Master Hub)</text>
      <text font-family="Inter, sans-serif" x="0" y="32" fill="#64748B" font-size="11">MkV CRM / Головний огляд платформи (Master Hub)</text>
    </g>

    <!-- Search Box -->
    <g transform="translate(810, 16)">
      <rect x="0" y="0" width="180" height="34" rx="8" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
      <text font-family="Inter, sans-serif" x="14" y="21" fill="#64748B" font-size="11.5">🔍 Пошук...</text>
    </g>

    <!-- Active Platforms Badges -->
    <g transform="translate(1005, 16)">
      <!-- Meta badge -->
      <rect x="0" y="0" width="105" height="34" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
      <circle cx="16" cy="17" r="3.5" fill="#10B981"/>
      <text font-family="Inter, sans-serif" x="26" y="21" fill="#E2E8F0" font-size="11" font-weight="600">Meta Ads</text>

      <!-- TikTok badge -->
      <rect x="115" y="0" width="105" height="34" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
      <circle cx="131" cy="17" r="3.5" fill="#10B981"/>
      <text font-family="Inter, sans-serif" x="141" y="21" fill="#E2E8F0" font-size="11" font-weight="600">TikTok Ads</text>

      <!-- Date Filter -->
      <rect x="230" y="0" width="165" height="34" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
      <text font-family="Inter, sans-serif" x="245" y="21" fill="#CBD5E1" font-size="11" font-weight="500">📅 Останні 30 днів</text>
    </g>
  </g>

  <!-- Main Content -->
  <g id="MainContent" transform="translate(280, 84)">
    
    <!-- Hero Greeting Card -->
    <g id="HeroCard">
      <rect x="0" y="0" width="1120" height="110" rx="14" fill="#131B2E" stroke="#1E293B" stroke-width="1.2"/>
      <text font-family="Inter, sans-serif" x="28" y="38" fill="#FFFFFF" font-size="18" font-weight="700">Вітаємо у MkV Sales Manager CRM, Михайле 👋</text>
      <text font-family="Inter, sans-serif" x="28" y="62" fill="#94A3B8" font-size="12.5">Усі рекламні кабінети підключені та синхронізовані. Система готова до запуску та оптимізації кампаній.</text>
      
      <!-- Quick badges -->
      <g transform="translate(28, 76)">
        <text font-family="Inter, sans-serif" x="0" y="16" fill="#10B981" font-size="11.5" font-weight="600">● За останні 24г: $640 витрат</text>
        <text font-family="Inter, sans-serif" x="190" y="16" fill="#10B981" font-size="11.5" font-weight="600">● 54 нові ліди</text>
        <text font-family="Inter, sans-serif" x="310" y="16" fill="#38BDF8" font-size="11.5" font-weight="600">● Середній ROAS 3.92x</text>
      </g>
      
      <g transform="translate(930, 36)">
        <rect x="0" y="0" width="160" height="38" rx="8" fill="url(#btnGrad)"/>
        <text font-family="Inter, sans-serif" x="80" y="23" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">+ Створити кампанію</text>
      </g>
    </g>

    <!-- 4 Functional Module Cards (2x2 Grid) -->
    <g id="ModuleGrid" transform="translate(0, 130)">
      
      <!-- Card 1: Analytics -->
      <g id="Card_Analytics" transform="translate(0, 0)">
        <rect x="0" y="0" width="545" height="260" rx="14" fill="#131B2E" stroke="#1E293B" stroke-width="1.2"/>
        <rect x="24" y="24" width="36" height="36" rx="8" fill="rgba(99, 102, 241, 0.15)"/>
        <text font-family="Inter, sans-serif" x="42" y="47" fill="#818CF8" font-size="16" font-weight="700" text-anchor="middle">📊</text>
        <text font-family="Inter, sans-serif" x="72" y="40" fill="#FFFFFF" font-size="15" font-weight="700">Панель крос-платформної аналітики</text>
        <text font-family="Inter, sans-serif" x="72" y="56" fill="#64748B" font-size="11.5">Meta Ads + TikTok Ads в одному вікні</text>

        <text font-family="Inter, sans-serif" x="24" y="98" fill="#94A3B8" font-size="12">Зведена аналітика витрат без перемикання кабінетів. Автоматичний підрахунок реальної окупності (ROAS), кількості заявок та вартості залучення клієнта (CPL).</text>

        <!-- KPI Mini Strip -->
        <g transform="translate(24, 135)">
          <rect x="0" y="0" width="497" height="54" rx="8" fill="#0A0E18" stroke="#1A2336" stroke-width="1"/>
          <text font-family="Inter, sans-serif" x="18" y="22" fill="#64748B" font-size="10">ВИТРАТИ</text>
          <text font-family="Inter, sans-serif" x="18" y="42" fill="#FFFFFF" font-size="14" font-weight="700">$14,820</text>
          
          <text font-family="Inter, sans-serif" x="180" y="22" fill="#64748B" font-size="10">СЕРЕДНІЙ ROAS</text>
          <text font-family="Inter, sans-serif" x="180" y="42" fill="#10B981" font-size="14" font-weight="700">3.82x</text>

          <text font-family="Inter, sans-serif" x="360" y="22" fill="#64748B" font-size="10">ЛІДИ</text>
          <text font-family="Inter, sans-serif" x="360" y="42" fill="#FFFFFF" font-size="14" font-weight="700">1,240</text>
        </g>

        <!-- Action Button -->
        <g transform="translate(24, 206)">
          <rect x="0" y="0" width="497" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
          <text font-family="Inter, sans-serif" x="248" y="21" fill="#818CF8" font-size="11.5" font-weight="600" text-anchor="middle">Перейти до аналітики (Розділ 2.1) →</text>
        </g>
      </g>

      <!-- Card 2: AI Studio -->
      <g id="Card_AI_Studio" transform="translate(575, 0)">
        <rect x="0" y="0" width="545" height="260" rx="14" fill="#131B2E" stroke="#1E293B" stroke-width="1.2"/>
        <rect x="24" y="24" width="36" height="36" rx="8" fill="rgba(168, 85, 247, 0.15)"/>
        <text font-family="Inter, sans-serif" x="42" y="47" fill="#C084FC" font-size="16" font-weight="700" text-anchor="middle">🎬</text>
        <text font-family="Inter, sans-serif" x="72" y="40" fill="#FFFFFF" font-size="15" font-weight="700">Креативна ШІ-студія та розкадровка</text>
        <text font-family="Inter, sans-serif" x="72" y="56" fill="#64748B" font-size="11.5">Генератор сценаріїв для TikTok та Reels</text>

        <text font-family="Inter, sans-serif" x="24" y="98" fill="#94A3B8" font-size="12">ШІ розписує відео по секундах: перші 0–3с для зачеплення глядача (хук), середина з демонстрацією продукту та кінцівка із закликом до покупки. Економія часу монтажера.</text>

        <!-- KPI Mini Strip -->
        <g transform="translate(24, 135)">
          <rect x="0" y="0" width="497" height="54" rx="8" fill="#0A0E18" stroke="#1A2336" stroke-width="1"/>
          <text font-family="Inter, sans-serif" x="18" y="22" fill="#64748B" font-size="10">ФОРМАТ</text>
          <text font-family="Inter, sans-serif" x="18" y="42" fill="#FFFFFF" font-size="13" font-weight="600">9:16 Вертикальне</text>
          
          <text font-family="Inter, sans-serif" x="180" y="22" fill="#64748B" font-size="10">СТРУКТУРА</text>
          <text font-family="Inter, sans-serif" x="180" y="42" fill="#A855F7" font-size="13" font-weight="600">3 сцени (Хук/Проблема/CTA)</text>

          <text font-family="Inter, sans-serif" x="380" y="22" fill="#64748B" font-size="10">ОЗВУЧКА</text>
          <text font-family="Inter, sans-serif" x="380" y="42" fill="#10B981" font-size="13" font-weight="600">AI Voiceover (Укр)</text>
        </g>

        <!-- Action Button -->
        <g transform="translate(24, 206)">
          <rect x="0" y="0" width="497" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
          <text font-family="Inter, sans-serif" x="248" y="21" fill="#C084FC" font-size="11.5" font-weight="600" text-anchor="middle">Відкрити ШІ-студію (Розділ 2.2) →</text>
        </g>
      </g>

      <!-- Card 3: Campaigns & Rules -->
      <g id="Card_Campaigns" transform="translate(0, 280)">
        <rect x="0" y="0" width="545" height="260" rx="14" fill="#131B2E" stroke="#1E293B" stroke-width="1.2"/>
        <rect x="24" y="24" width="36" height="36" rx="8" fill="rgba(16, 185, 129, 0.15)"/>
        <text font-family="Inter, sans-serif" x="42" y="47" fill="#34D399" font-size="16" font-weight="700" text-anchor="middle">🚀</text>
        <text font-family="Inter, sans-serif" x="72" y="40" fill="#FFFFFF" font-size="15" font-weight="700">Кампанії та правила медіабаїнгу</text>
        <text font-family="Inter, sans-serif" x="72" y="56" fill="#64748B" font-size="11.5">Автоматизація управління рекламним бюджетом</text>

        <text font-family="Inter, sans-serif" x="24" y="98" fill="#94A3B8" font-size="12">Зручні швидкі перемикачі для активації оголошень. Розумні правила безпеки: автоматична зупинка реклами, якщо вартість ліда перевищує $15, та масштабування успішних зв'язок.</text>

        <!-- KPI Mini Strip -->
        <g transform="translate(24, 135)">
          <rect x="0" y="0" width="497" height="54" rx="8" fill="#0A0E18" stroke="#1A2336" stroke-width="1"/>
          <text font-family="Inter, sans-serif" x="18" y="22" fill="#64748B" font-size="10">АКТИВНІ КАМПАНІЇ</text>
          <text font-family="Inter, sans-serif" x="18" y="42" fill="#FFFFFF" font-size="14" font-weight="700">5 кампаній</text>
          
          <text font-family="Inter, sans-serif" x="180" y="22" fill="#64748B" font-size="10">CPA GUARD</text>
          <text font-family="Inter, sans-serif" x="180" y="42" fill="#10B981" font-size="13" font-weight="600">Авто-пауза > $15</text>

          <text font-family="Inter, sans-serif" x="360" y="22" fill="#64748B" font-size="10">ВРЯТОВАНО БЮДЖЕТУ</text>
          <text font-family="Inter, sans-serif" x="360" y="42" fill="#38BDF8" font-size="14" font-weight="700">$340.00</text>
        </g>

        <!-- Action Button -->
        <g transform="translate(24, 206)">
          <rect x="0" y="0" width="497" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
          <text font-family="Inter, sans-serif" x="248" y="21" fill="#34D399" font-size="11.5" font-weight="600" text-anchor="middle">Керувати кампаніями (Розділ 2.3) →</text>
        </g>
      </g>

      <!-- Card 4: Ad Fatigue -->
      <g id="Card_Ad_Fatigue" transform="translate(575, 280)">
        <rect x="0" y="0" width="545" height="260" rx="14" fill="#131B2E" stroke="#1E293B" stroke-width="1.2"/>
        <rect x="24" y="24" width="36" height="36" rx="8" fill="rgba(239, 68, 68, 0.15)"/>
        <text font-family="Inter, sans-serif" x="42" y="47" fill="#F87171" font-size="16" font-weight="700" text-anchor="middle">🔥</text>
        <text font-family="Inter, sans-serif" x="72" y="40" fill="#FFFFFF" font-size="15" font-weight="700">Детектор вигорання аудиторії та хуки</text>
        <text font-family="Inter, sans-serif" x="72" y="56" fill="#64748B" font-size="11.5">Контроль втоми оголошень та ротація перших 3с</text>

        <text font-family="Inter, sans-serif" x="24" y="98" fill="#94A3B8" font-size="12">Відстеження моменту, коли люди перестають клікати на рекламу. Замість тривалого перезнімання всього ролика достатньо змінити перші 3 секунди (хук) прямо в інтерфейсі.</text>

        <!-- KPI Mini Strip -->
        <g transform="translate(24, 135)">
          <rect x="0" y="0" width="497" height="54" rx="8" fill="#0A0E18" stroke="#1A2336" stroke-width="1"/>
          <text font-family="Inter, sans-serif" x="18" y="22" fill="#64748B" font-size="10">СТАН АУДИТОРІЇ</text>
          <text font-family="Inter, sans-serif" x="18" y="42" fill="#10B981" font-size="13" font-weight="600">Втома низька (24%)</text>
          
          <text font-family="Inter, sans-serif" x="180" y="22" fill="#64748B" font-size="10">УТРИМАННЯ (3s HOLD)</text>
          <text font-family="Inter, sans-serif" x="180" y="42" fill="#38BDF8" font-size="13" font-weight="600">48.2% (Відмінно)</text>

          <text font-family="Inter, sans-serif" x="360" y="22" fill="#64748B" font-size="10">ПОТРЕБУЮТЬ ЗАМІНИ</text>
          <text font-family="Inter, sans-serif" x="360" y="42" fill="#F87171" font-size="14" font-weight="700">1 оголошення</text>
        </g>

        <!-- Action Button -->
        <g transform="translate(24, 206)">
          <rect x="0" y="0" width="497" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
          <text font-family="Inter, sans-serif" x="248" y="21" fill="#F87171" font-size="11.5" font-weight="600" text-anchor="middle">Перевірити вигорання (Розділ 2.4) →</text>
        </g>
      </g>
    </g>

    <!-- Bottom Activity Footer -->
    <g id="RecentActivity" transform="translate(0, 700)">
      <rect x="0" y="0" width="1120" height="74" rx="10" fill="#0E1422" stroke="#1A2336" stroke-width="1"/>
      <text font-family="Inter, sans-serif" x="20" y="28" fill="#64748B" font-size="10.5" font-weight="700">ОСТАННІ ПОДІЇ СИСТЕМИ</text>
      <text font-family="Inter, sans-serif" x="20" y="52" fill="#CBD5E1" font-size="12">● [14:20] Авто-правило CPA Threshold зупинило збиткову групу оголошень "Retargeting_UA"</text>
      <text font-family="Inter, sans-serif" x="620" y="52" fill="#CBD5E1" font-size="12">● [12:05] ШІ згенерував сценарій для TikTok «EcoCosmetics_Hook_01»</text>
    </g>
  </g>
</svg>