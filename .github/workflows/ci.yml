name: CI / Static Validation

on:
  push:
    branches: [ "main", "feature/ui-ux-design" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Core Lab Assets and Mockups Structure
        run: |
          echo "Validating project assets and structure..."
          test -f docs/Laboratorna_Robota_2_Bahyn_MkV_Sales_Manager.docx
          test -d mockups
          test -f mockups/01_Головний_огляд_платформи.svg
          test -f mockups/02_Дашборд_аналітики.svg
          test -f mockups/03_ШІ_Студія_креативів.svg
          test -f mockups/04_Кампанії_та_медіабаїнг.svg
          test -f mockups/05_Детектор_вигорання_та_хуки.svg
          test -f mockups/06_Модальне_вікно_авторизації.svg
          test -f package.json
          test -f README.md
          echo "All core files validated successfully!"
